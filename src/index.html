<!DOCTYPE html>
<html lang="es">

<head>
  <meta name="google" content="notranslate">
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>

  <!-- Google Translate Widget (Hidden) -->
  <div style="position: absolute; top: -10000px; left: -10000px; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;"><div id="google_translate_element"></div></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es', 
        includedLanguages: 'es,en,pt', 
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script type="text/javascript">
    window.changeGoogleTranslateLanguage = function(langCode) {
      setTimeout(() => {
        const selectEl = document.querySelector('select.goog-te-combo');
        if (selectEl) {
          selectEl.value = langCode;
          selectEl.dispatchEvent(new Event('change'));
        }
      }, 500);
    };
  </script>
</body>
</html>
