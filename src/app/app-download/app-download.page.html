<ion-header class="ion-no-border">
  <div class="modern-top-bar">
    <button class="back-icon-btn" routerLink="/home">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <div class="top-bar-title">
      <h2>Descarga la App</h2>
      <span>Lleva MercaTalk en tu celular</span>
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="app-download-content">
  <div class="container">
    
    <!-- QR 1: Descarga Directa -->
    <div class="qr-section">
      <h3>Escanea para descargar la app</h3>
      <img [src]="qrCodes.directDownload" alt="QR Descarga Directa" class="qr-code">
    </div>


  </div>
</ion-content>
